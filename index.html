<!DOCTYPE html>
<html>
<head>
  <title>Monster Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <h1>Scan a Barcode</h1>
  <div id="reader" style="width:300px;"></div>

<script>
function onScanSuccess(decodedText, decodedResult) {
    console.log("SCAN FIRED:", decodedText);

    fetch("https://script.google.com/macros/s/AKfycbwgO_MS8wOii9LuhVXyM5uARxzDveTl6YsjwirWrC1f9b_xpd7G627_mvfzPIHD2x-VdQ/exec?code=" 
          + encodeURIComponent(decodedText))
      .then(response => response.json())
      .then(data => {
        console.log(data);

        window.location.href = "monster-scanner://scan?code=" + encodeURIComponent(decodedText);
      });
}

const scanner = new Html5QrcodeScanner(
  "reader",
  {
    fps: 10,
    qrbox: 250,
    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA],
    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  }
);

scanner.render(onScanSuccess);
</script>

</body>
</html>
